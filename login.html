<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign in — Solace</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Solace" />
  <meta name="theme-color" content="#8B9A8C" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
</head>
<body class="font-sans bg-brand-50 text-ink min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
      <span class="relative w-12 h-12 rounded-xl bg-brand-500 flex items-center justify-center shrink-0 mb-3">
        <img src="assets/logo.png" alt="Solace" class="w-full h-full rounded-xl object-cover" onerror="this.style.display='none';" />
        <span class="absolute inset-0 flex items-center justify-center text-white text-lg font-semibold" style="z-index:-1">S</span>
      </span>
      <span class="text-xl font-semibold text-ink tracking-tight">Solace</span>
    </div>

    <form id="login-form" class="rounded-card bg-white shadow-card-lg p-6 space-y-4">
      <div>
        <label class="text-xs font-medium text-ink-400 block mb-1">Password</label>
        <input required autofocus type="password" id="password" class="w-full text-sm px-3 py-2.5 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" />
      </div>
      <p id="error-msg" class="text-xs text-red-600 hidden">Incorrect password.</p>
      <button type="submit" class="w-full text-sm font-medium bg-brand-500 hover:bg-brand-600 text-white rounded-lg py-2.5 transition-colors">Sign in</button>
    </form>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");
      errorMsg.classList.add("hidden");
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get("next") || "/index.html";
        } else {
          errorMsg.classList.remove("hidden");
        }
      } catch {
        errorMsg.textContent = "Something went wrong. Try again.";
        errorMsg.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
