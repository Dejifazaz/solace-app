<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Calendar — Solace</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Solace" />
  <meta name="theme-color" content="#8B9A8C" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="calendar" data-title="Calendar" class="font-sans bg-brand-50 text-ink">
  <div id="solace-sidebar"></div>
  <div id="solace-topbar"></div>

  <main class="lg:ml-64 pt-16 px-4 sm:px-6 lg:px-8 pb-10 transition-[margin] duration-200">
    <div class="max-w-[1100px] mx-auto py-6 space-y-6">

      <div class="flex items-center justify-between">
        <h2 id="month-label" class="text-lg font-semibold text-ink"></h2>
        <div class="flex items-center gap-2">
          <button id="prev-month" class="w-8 h-8 rounded-full bg-white shadow-card flex items-center justify-center text-ink-600">&larr;</button>
          <button id="next-month" class="w-8 h-8 rounded-full bg-white shadow-card flex items-center justify-center text-ink-600">&rarr;</button>
        </div>
      </div>

      <div class="rounded-card bg-white shadow-card p-3 sm:p-6 overflow-x-auto">
        <div id="calendar-mount" class="min-w-[640px]"></div>
      </div>

      <div class="flex items-center gap-4 text-xs text-ink-400">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-brand-500 inline-block"></span> Task due</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-ink-900 inline-block"></span> Callback scheduled</span>
      </div>

    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/shell.js"></script>
  <script>
    const now = new Date();
    let viewYear = now.getFullYear();
    let viewMonth = now.getMonth();

    function render() {
      const tasks = Store.get("tasks", []);
      const calls = Store.get("calls", []);
      const events = buildCalendarEvents(tasks, calls);
      renderCalendar("calendar-mount", viewYear, viewMonth, events);
      document.getElementById("month-label").textContent = new Date(viewYear, viewMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await Store.ready;
      render();
      document.getElementById("prev-month").addEventListener("click", () => {
        viewMonth -= 1;
        if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
        render();
      });
      document.getElementById("next-month").addEventListener("click", () => {
        viewMonth += 1;
        if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
        render();
      });
    });
  </script>
</body>
</html>
