<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Operations — Solace</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Solace" />
  <meta name="theme-color" content="#8B9A8C" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="team-operations" data-title="Operations" class="font-sans bg-brand-50 text-ink">
  <div id="solace-sidebar"></div>
  <div id="solace-topbar"></div>

  <main class="lg:ml-64 pt-16 px-4 sm:px-6 lg:px-8 pb-10 transition-[margin] duration-200">
    <div class="max-w-[1200px] mx-auto py-6 space-y-6">

      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4" id="stats-mount"></div>

      <div class="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-6 items-start">
        <div class="rounded-card bg-white shadow-card p-6 overflow-x-auto">
          <h3 class="text-sm font-semibold text-ink mb-4">Active Projects</h3>
          <div id="gantt-mount"></div>
        </div>

        <div class="rounded-card bg-white shadow-card p-5">
          <h3 class="text-sm font-semibold text-ink mb-3">Team Contacts</h3>
          <div id="contacts-mount" class="flex flex-col divide-y divide-brand-50"></div>
        </div>
      </div>

      <div class="rounded-card bg-white shadow-card p-6">
        <h3 class="text-sm font-semibold text-ink mb-4">Tasks</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-ink-400 mb-3">To Do</p>
            <div id="col-todo" class="flex flex-col gap-3"></div>
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-ink-400 mb-3">In Progress</p>
            <div id="col-in_progress" class="flex flex-col gap-3"></div>
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-ink-400 mb-3">Done</p>
            <div id="col-done" class="flex flex-col gap-3"></div>
          </div>
        </div>
      </div>

      <div class="rounded-card bg-white shadow-card p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-ink">Maintenance &amp; Work Orders</h3>
          <button id="toggle-wo-form" class="text-xs font-medium text-brand-700 bg-brand-100 hover:bg-brand-200 px-2.5 py-1 rounded-full transition-colors">+ New Work Order</button>
        </div>

        <form id="wo-form" class="hidden grid-cols-1 sm:grid-cols-4 gap-2 mb-5 pb-5 border-b border-brand-100">
          <select required id="wo-property" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300"></select>
          <input required id="wo-title" type="text" placeholder="Issue / title" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" />
          <select id="wo-priority" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <input id="wo-vendor" type="text" placeholder="Vendor (optional)" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" />
          <button type="submit" class="sm:col-span-4 text-sm font-medium bg-brand-500 hover:bg-brand-600 text-white rounded-lg py-2 transition-colors">Create Work Order</button>
        </form>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-ink-400 mb-3">Open</p>
            <div id="wo-col-open" class="flex flex-col gap-3"></div>
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-ink-400 mb-3">In Progress</p>
            <div id="wo-col-in_progress" class="flex flex-col gap-3"></div>
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-ink-400 mb-3">Done</p>
            <div id="wo-col-done" class="flex flex-col gap-3"></div>
          </div>
        </div>
      </div>

      <div class="rounded-card bg-white shadow-card p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-ink">Tenants &amp; Leases</h3>
          <button id="toggle-lease-form" class="text-xs font-medium text-brand-700 bg-brand-100 hover:bg-brand-200 px-2.5 py-1 rounded-full transition-colors">+ Add Lease</button>
        </div>

        <form id="lease-form" class="hidden grid-cols-1 sm:grid-cols-3 gap-2 mb-5 pb-5 border-b border-brand-100">
          <select required id="lease-property" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300"></select>
          <input required id="lease-tenant-name" type="text" placeholder="Tenant name" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" />
          <input id="lease-tenant-phone" type="text" placeholder="Phone (optional)" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" />
          <input id="lease-tenant-email" type="email" placeholder="Email (optional)" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" />
          <input required id="lease-rent" type="number" min="0" placeholder="Monthly rent" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" />
          <input required id="lease-start" type="date" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" title="Lease start" />
          <input required id="lease-end" type="date" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" title="Lease end" />
          <button type="submit" class="sm:col-span-3 text-sm font-medium bg-brand-500 hover:bg-brand-600 text-white rounded-lg py-2 transition-colors">Save Lease</button>
        </form>

        <div id="leases-mount" class="flex flex-col divide-y divide-brand-50"></div>
      </div>

      <div class="rounded-card bg-white shadow-card p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-ink">Income &amp; Expenses</h3>
          <button id="toggle-txn-form" class="text-xs font-medium text-brand-700 bg-brand-100 hover:bg-brand-200 px-2.5 py-1 rounded-full transition-colors">+ Add Transaction</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6" id="pl-stats-mount"></div>

        <form id="txn-form" class="hidden grid-cols-1 sm:grid-cols-5 gap-2 mb-5 pb-5 border-b border-brand-100">
          <select required id="txn-property" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300"></select>
          <select id="txn-type" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="txn-category" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300"></select>
          <input required id="txn-amount" type="number" min="0" step="0.01" placeholder="Amount" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" />
          <input required id="txn-date" type="date" class="text-sm px-3 py-2 rounded-lg border border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-300" />
          <button type="submit" class="sm:col-span-5 text-sm font-medium bg-brand-500 hover:bg-brand-600 text-white rounded-lg py-2 transition-colors">Save Transaction</button>
        </form>

        <div id="pl-by-property-mount" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6"></div>

        <p class="text-xs font-semibold text-ink-400 uppercase tracking-wider mb-2">Recent Transactions</p>
        <div id="txn-list-mount" class="flex flex-col divide-y divide-brand-50"></div>
      </div>

    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/gantt.js"></script>
  <script src="js/shell.js"></script>
  <script>
    const TEAM = "operations";

    function taskCard(t) {
      return `
        <div class="rounded-card bg-brand-50/60 p-4">
          <p class="text-sm font-medium text-ink mb-1">${t.title}</p>
          <p class="text-xs text-ink-400 mb-3">Due ${formatDate(t.dueDate)}</p>
          <select data-task-id="${t.id}" class="task-status-select w-full text-xs font-medium rounded-lg border border-brand-200 px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-brand-300">
            <option value="todo" ${t.status === "todo" ? "selected" : ""}>To Do</option>
            <option value="in_progress" ${t.status === "in_progress" ? "selected" : ""}>In Progress</option>
            <option value="done" ${t.status === "done" ? "selected" : ""}>Done</option>
          </select>
        </div>
      `;
    }

    function render() {
      const tasks = Store.get("tasks", []).filter((t) => t.team === TEAM);
      const projects = Store.get("projects", []).filter((p) => p.team === TEAM);
      const contacts = Store.get("contacts", []).filter((c) => c.team === TEAM);
      const properties = Store.get("properties", []);

      const workOrders = Store.get("workOrders", []);
      const leases = Store.get("leases", []);
      const expiringSoon = leases.filter((l) => {
        const d = daysBetween(todayStr(), l.leaseEnd);
        return d >= 0 && d <= 60;
      }).length;

      document.getElementById("stats-mount").innerHTML = `
        ${statCard({ label: "Open Tasks", value: tasks.filter((t) => t.status !== "done").length })}
        ${statCard({ label: "Active Projects", value: projects.length })}
        ${statCard({ label: "Owned Properties", value: properties.filter((p) => p.type === "owned").length })}
        ${statCard({ label: "Team Contacts", value: contacts.length })}
        ${statCard({ label: "Open Work Orders", value: workOrders.filter((w) => w.status !== "done").length })}
        ${statCard({ label: "Leases Expiring Soon", value: expiringSoon })}
      `;

      renderGantt("gantt-mount", projects);

      document.getElementById("contacts-mount").innerHTML = contacts
        .map(
          (c) => `
        <div class="flex items-center gap-3 py-3">
          <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-700 text-xs font-semibold flex items-center justify-center shrink-0">${initials(c.name)}</div>
          <div class="min-w-0">
            <p class="text-sm font-medium text-ink truncate">${c.name}</p>
            <p class="text-xs text-ink-400 truncate">${c.role} &middot; ${c.company}</p>
          </div>
        </div>
      `
        )
        .join("") || `<p class="text-sm text-ink-400 py-2">No contacts yet.</p>`;

      ["todo", "in_progress", "done"].forEach((status) => {
        const col = document.getElementById("col-" + status);
        col.innerHTML = tasks.filter((t) => t.status === status).map(taskCard).join("") || `<p class="text-xs text-ink-400">Nothing here</p>`;
      });
      document.querySelectorAll(".task-status-select").forEach((sel) => {
        sel.addEventListener("change", (e) => {
          const id = e.target.getAttribute("data-task-id");
          Store.update("tasks", (tasks) => tasks.map((t) => (t.id === id ? { ...t, status: e.target.value } : t)));
          render();
        });
      });
    }

    function workOrderCard(w, propertyAddress) {
      const priorityMeta = WORK_ORDER_PRIORITY_META[w.priority];
      return `
        <div class="rounded-card bg-brand-50/60 p-4">
          <div class="flex items-center justify-between gap-2 mb-1">
            <p class="text-sm font-medium text-ink truncate">${w.title}</p>
            <span class="inline-flex text-[10px] font-medium px-2 py-0.5 rounded-full shrink-0 ${priorityMeta.classes}">${priorityMeta.label}</span>
          </div>
          <p class="text-xs text-ink-400 mb-1 truncate">${propertyAddress}</p>
          ${w.vendor ? `<p class="text-[11px] text-ink-400 mb-2">Vendor: ${w.vendor}</p>` : ""}
          <select data-wo-id="${w.id}" class="wo-status-select w-full text-xs font-medium rounded-lg border border-brand-200 px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-brand-300">
            <option value="open" ${w.status === "open" ? "selected" : ""}>Open</option>
            <option value="in_progress" ${w.status === "in_progress" ? "selected" : ""}>In Progress</option>
            <option value="done" ${w.status === "done" ? "selected" : ""}>Done</option>
          </select>
        </div>
      `;
    }

    function renderWorkOrders() {
      const properties = Store.get("properties", []).filter((p) => p.type === "owned");
      const allProperties = Store.get("properties", []);
      const workOrders = Store.get("workOrders", []);

      const propertySelect = document.getElementById("wo-property");
      propertySelect.innerHTML = properties.length
        ? properties.map((p) => `<option value="${p.id}">${p.address}</option>`).join("")
        : `<option value="">Add an owned property first</option>`;

      ["open", "in_progress", "done"].forEach((status) => {
        const col = document.getElementById("wo-col-" + status);
        const items = workOrders.filter((w) => w.status === status);
        col.innerHTML =
          items
            .map((w) => {
              const prop = allProperties.find((p) => p.id === w.propertyId);
              return workOrderCard(w, prop ? prop.address : "Unknown property");
            })
            .join("") || `<p class="text-xs text-ink-400">Nothing here</p>`;
      });

      document.querySelectorAll(".wo-status-select").forEach((sel) => {
        sel.addEventListener("change", (e) => {
          const id = e.target.getAttribute("data-wo-id");
          const newStatus = e.target.value;
          Store.update("workOrders", (wos) =>
            wos.map((w) =>
              w.id === id ? { ...w, status: newStatus, completedAt: newStatus === "done" && w.status !== "done" ? todayStr() : w.completedAt } : w
            )
          );
          renderWorkOrders();
        });
      });
    }

    function leaseStatusBadge(leaseEnd) {
      const days = daysBetween(todayStr(), leaseEnd);
      if (days < 0) return `<span class="inline-flex text-[10px] font-medium px-2 py-0.5 rounded-full bg-red-100 text-red-700 shrink-0">Expired</span>`;
      if (days <= 60) return `<span class="inline-flex text-[10px] font-medium px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 shrink-0">Expires in ${days}d</span>`;
      return `<span class="inline-flex text-[10px] font-medium px-2 py-0.5 rounded-full bg-brand-100 text-brand-700 shrink-0">Active</span>`;
    }

    function renderLeases() {
      const properties = Store.get("properties", []).filter((p) => p.type === "owned");
      const allProperties = Store.get("properties", []);
      const leases = Store.get("leases", []);

      const propertySelect = document.getElementById("lease-property");
      propertySelect.innerHTML = properties.length
        ? properties.map((p) => `<option value="${p.id}">${p.address}</option>`).join("")
        : `<option value="">Add an owned property first</option>`;

      const sorted = [...leases].sort((a, b) => (a.leaseEnd < b.leaseEnd ? -1 : 1));
      document.getElementById("leases-mount").innerHTML =
        sorted
          .map((l) => {
            const prop = allProperties.find((p) => p.id === l.propertyId);
            return `
          <div class="flex items-center justify-between gap-3 py-3">
            <div class="min-w-0">
              <p class="text-sm font-medium text-ink truncate">${l.tenantName} <span class="text-ink-400 font-normal">&middot; ${prop ? prop.address : "Unknown property"}</span></p>
              <p class="text-xs text-ink-400">${formatMoney(l.rentAmount)}/mo &middot; ${formatDate(l.leaseStart)} – ${formatDate(l.leaseEnd)}</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              ${leaseStatusBadge(l.leaseEnd)}
              <button type="button" data-lease-remove="${l.id}" class="lease-remove text-ink-300 hover:text-red-500 leading-none">&times;</button>
            </div>
          </div>
        `;
          })
          .join("") || `<p class="text-sm text-ink-400 py-2">No leases yet.</p>`;

      document.querySelectorAll(".lease-remove").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-lease-remove");
          Store.update("leases", (leases) => leases.filter((l) => l.id !== id));
          renderLeases();
        });
      });
    }

    function populateCategoryOptions(type) {
      const sel = document.getElementById("txn-category");
      sel.innerHTML = TRANSACTION_CATEGORIES[type].map((c) => `<option value="${c.key}">${c.label}</option>`).join("");
    }

    function categoryLabel(type, key) {
      return (TRANSACTION_CATEGORIES[type] || []).find((c) => c.key === key)?.label || key;
    }

    function renderFinance() {
      const properties = Store.get("properties", []).filter((p) => p.type === "owned");
      const transactions = Store.get("transactions", []);

      const totalIncome = transactions.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
      const totalExpenses = transactions.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
      const net = totalIncome - totalExpenses;

      document.getElementById("pl-stats-mount").innerHTML = `
        ${statCard({ label: "Total Income", value: formatMoney(totalIncome), accent: "bg-brand-500 text-white" })}
        ${statCard({ label: "Total Expenses", value: formatMoney(totalExpenses), accent: "bg-ink-900 text-white" })}
        ${statCard({ label: "Net Cash Flow", value: formatMoney(net), accent: net < 0 ? "bg-red-500 text-white" : "bg-brand-500 text-white" })}
      `;

      const propertySelect = document.getElementById("txn-property");
      propertySelect.innerHTML = properties.length
        ? properties.map((p) => `<option value="${p.id}">${p.address}</option>`).join("")
        : `<option value="">Add an owned property first</option>`;

      document.getElementById("pl-by-property-mount").innerHTML =
        properties
          .map((p) => {
            const propTxns = transactions.filter((t) => t.propertyId === p.id);
            const income = propTxns.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
            const expenses = propTxns.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
            const propNet = income - expenses;
            return `
          <div class="rounded-xl border border-brand-100 p-3">
            <p class="text-xs font-semibold text-ink truncate">${p.address}</p>
            <p class="text-[11px] text-ink-400 mb-1">Income ${formatMoney(income)} &middot; Expenses ${formatMoney(expenses)}</p>
            <p class="text-sm font-semibold ${propNet < 0 ? "text-red-600" : "text-brand-700"}">${formatMoney(propNet)} net</p>
          </div>
        `;
          })
          .join("") || `<p class="text-xs text-ink-400 sm:col-span-2">No owned properties yet — mark a pipeline property "Closed" in Property Acquisition to see it here.</p>`;

      const allProperties = Store.get("properties", []);
      const sorted = [...transactions].sort((a, b) => (a.date < b.date ? 1 : -1));
      document.getElementById("txn-list-mount").innerHTML =
        sorted
          .map((t) => {
            const prop = allProperties.find((p) => p.id === t.propertyId);
            return `
          <div class="flex items-center justify-between gap-3 py-3">
            <div class="min-w-0">
              <p class="text-sm font-medium text-ink truncate">${prop ? prop.address : "Unknown property"}</p>
              <p class="text-xs text-ink-400">${categoryLabel(t.type, t.category)} &middot; ${formatDate(t.date)}</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-sm font-semibold ${t.type === "income" ? "text-brand-700" : "text-red-600"}">${t.type === "income" ? "+" : "-"}${formatMoney(t.amount)}</span>
              <button type="button" data-txn-remove="${t.id}" class="txn-remove text-ink-300 hover:text-red-500 leading-none">&times;</button>
            </div>
          </div>
        `;
          })
          .join("") || `<p class="text-sm text-ink-400 py-2">No transactions logged yet.</p>`;

      document.querySelectorAll(".txn-remove").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-txn-remove");
          Store.update("transactions", (txns) => txns.filter((t) => t.id !== id));
          renderFinance();
        });
      });
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await Store.ready;
      render();
      populateCategoryOptions("income");
      document.getElementById("txn-date").value = todayStr();
      renderFinance();
      renderWorkOrders();
      renderLeases();

      document.getElementById("toggle-wo-form").addEventListener("click", () => {
        const form = document.getElementById("wo-form");
        form.classList.toggle("hidden");
        form.classList.toggle("grid");
      });

      document.getElementById("wo-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const propertyId = document.getElementById("wo-property").value;
        if (!propertyId) return;
        const title = document.getElementById("wo-title").value.trim();
        if (!title) return;
        const priority = document.getElementById("wo-priority").value;
        const vendor = document.getElementById("wo-vendor").value.trim();
        Store.update("workOrders", (wos) => [
          ...wos,
          { id: uid("wo"), propertyId, title, priority, vendor, status: "open", createdAt: todayStr(), completedAt: null },
        ]);
        e.target.reset();
        document.getElementById("wo-priority").value = "medium";
        e.target.classList.add("hidden");
        e.target.classList.remove("grid");
        renderWorkOrders();
        render();
      });

      document.getElementById("toggle-lease-form").addEventListener("click", () => {
        const form = document.getElementById("lease-form");
        form.classList.toggle("hidden");
        form.classList.toggle("grid");
      });

      document.getElementById("lease-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const propertyId = document.getElementById("lease-property").value;
        if (!propertyId) return;
        const tenantName = document.getElementById("lease-tenant-name").value.trim();
        const tenantPhone = document.getElementById("lease-tenant-phone").value.trim();
        const tenantEmail = document.getElementById("lease-tenant-email").value.trim();
        const rentAmount = parseFloat(document.getElementById("lease-rent").value);
        const leaseStart = document.getElementById("lease-start").value;
        const leaseEnd = document.getElementById("lease-end").value;
        if (!tenantName || !rentAmount || !leaseStart || !leaseEnd) return;
        Store.update("leases", (leases) => [
          ...leases,
          { id: uid("lease"), propertyId, tenantName, tenantPhone, tenantEmail, rentAmount, leaseStart, leaseEnd },
        ]);
        e.target.reset();
        e.target.classList.add("hidden");
        e.target.classList.remove("grid");
        renderLeases();
        render();
      });

      document.getElementById("toggle-txn-form").addEventListener("click", () => {
        const form = document.getElementById("txn-form");
        form.classList.toggle("hidden");
        form.classList.toggle("grid");
      });

      document.getElementById("txn-type").addEventListener("change", (e) => populateCategoryOptions(e.target.value));

      document.getElementById("txn-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const propertyId = document.getElementById("txn-property").value;
        if (!propertyId) return;
        const type = document.getElementById("txn-type").value;
        const category = document.getElementById("txn-category").value;
        const amount = parseFloat(document.getElementById("txn-amount").value);
        const date = document.getElementById("txn-date").value;
        if (!amount || !date) return;
        Store.update("transactions", (txns) => [...txns, { id: uid("txn"), propertyId, type, category, amount, date, notes: "" }]);
        e.target.reset();
        document.getElementById("txn-date").value = todayStr();
        populateCategoryOptions("income");
        e.target.classList.add("hidden");
        e.target.classList.remove("grid");
        renderFinance();
      });
    });
  </script>
</body>
</html>
