<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Docs — Solace</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Solace" />
  <meta name="theme-color" content="#8B9A8C" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="docs" data-title="Docs" class="font-sans bg-brand-50 text-ink">
  <div id="solace-sidebar"></div>
  <div id="solace-topbar"></div>

  <main class="lg:ml-64 pt-16 px-4 sm:px-6 lg:px-8 pb-10 transition-[margin] duration-200">
    <div class="max-w-[1000px] mx-auto py-6 space-y-8">
      <p class="text-sm text-ink-400">Playbooks and SOPs, organized by team.</p>
      <div id="docs-groups-mount" class="space-y-8"></div>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shell.js"></script>
  <script>
    const DOC_GROUPS = [
      { key: "acquisition", label: "Property Acquisition", accent: "border-l-brand-500", icon: "bg-brand-100 text-brand-700" },
      { key: "operations", label: "Operations", accent: "border-l-ink-600", icon: "bg-ink-50 text-ink-600" },
      { key: "marketing", label: "Marketing", accent: "border-l-amber-400", icon: "bg-amber-100 text-amber-800" },
    ];

    function docCard(d, group) {
      return `
        <a href="${d.contentPage}" class="rounded-card bg-white shadow-card p-5 border-l-4 ${group.accent} hover:shadow-lg transition-shadow flex flex-col gap-2">
          <div class="flex items-start justify-between gap-2">
            <div class="w-9 h-9 rounded-lg ${group.icon} flex items-center justify-center shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16.5h6"/></svg>
            </div>
          </div>
          <p class="text-sm font-semibold text-ink">${d.title}</p>
          <p class="text-xs text-ink-400">${d.summary}</p>
          <p class="text-[11px] text-ink-400 mt-1">Updated ${new Date(d.updatedAt).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</p>
        </a>
      `;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await Store.ready;
      const docs = Store.get("docs", []);
      document.getElementById("docs-groups-mount").innerHTML = DOC_GROUPS.map((group) => {
        const items = docs.filter((d) => d.team === group.key);
        if (items.length === 0) return "";
        return `
          <div>
            <h3 class="text-sm font-semibold uppercase tracking-wider text-ink-400 mb-3">${group.label}</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${items.map((d) => docCard(d, group)).join("")}</div>
          </div>
        `;
      }).join("");
    });
  </script>
</body>
</html>
